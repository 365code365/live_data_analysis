<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>screen</title>
<style>
  /* 只有画面：没有工具栏、没有状态栏、没有任何 noVNC 自带的 UI */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { width: 100%; height: 100%; }
  #screen canvas { display: block; }
  #msg {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: #8b98a8; background: #0a0d11; padding: 20px;
    font: 13px/1.7 -apple-system, "PingFang SC", sans-serif;
  }
  #msg.show { display: flex; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="msg"></div>
<script type="module">
// 直接用 noVNC 的 RFB 内核，不用它自带的 vnc.html / vnc_lite.html：
//   * vnc.html 会带一条控制栏（产品里不需要）
//   * vnc_lite.html 是 demo 页，1.3 里参数名是 scale 而非 resize，
//     且实测在 iframe 里握手会停在 ProtocolVersion 不往下走
import RFB from './core/rfb.js';

const q = new URLSearchParams(location.search);
const msgBox = document.getElementById('msg');

function notify(state, detail) {
  // 把连接状态抛给父页面，让控制台能显示真实原因而不是一片黑
  try {
    parent.postMessage({ source: 'ldm-screen', state, detail: detail || '' }, '*');
  } catch (_) { /* 跨域不可达时忽略 */ }
}

function showMsg(text) {
  msgBox.textContent = text;
  msgBox.classList.add('show');
}
function hideMsg() { msgBox.classList.remove('show'); }

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const url = `${proto}://${location.host}/${q.get('path') || 'websockify'}`;

showMsg('正在连接…');
notify('connecting');

let rfb;
try {
  rfb = new RFB(document.getElementById('screen'), url, {
    credentials: { password: q.get('password') || '' },
    shared: true,
    wsProtocols: ['binary'],
  });
} catch (err) {
  showMsg('创建连接失败: ' + err.message);
  notify('error', err.message);
  throw err;
}

// scale=1（默认）：画面缩放到铺满 iframe。父页面会把 iframe 尺寸算成
// 设备分辨率 × 缩放比（且不超过 1:1），所以这里不会出现放大失真。
rfb.scaleViewport = q.get('scale') !== '0';
// 不让浏览器去改安卓端分辨率，那会把设备真实屏幕尺寸改掉
rfb.resizeSession = false;
rfb.clipViewport = false;
rfb.background = '#000';
rfb.viewOnly = q.get('view_only') === '1';
rfb.focusOnClick = true;
rfb.qualityLevel = Number(q.get('quality') || 6);
rfb.compressionLevel = Number(q.get('compression') || 2);

rfb.addEventListener('connect', () => {
  hideMsg();
  notify('connected');
  try { rfb.focus(); } catch (_) {}
});

rfb.addEventListener('disconnect', (e) => {
  const clean = e.detail && e.detail.clean;
  showMsg(clean ? '连接已断开' : '连接中断，正在重连…');
  notify('disconnected', clean ? 'clean' : 'unclean');
  if (q.get('reconnect') !== '0') {
    setTimeout(() => location.reload(), 3000);
  }
});

rfb.addEventListener('credentialsrequired', () => {
  showMsg('需要 VNC 密码（链接里的 password 参数不正确）');
  notify('auth_required');
});

rfb.addEventListener('securityfailure', (e) => {
  const reason = (e.detail && e.detail.reason) || '认证失败';
  showMsg('认证失败: ' + reason);
  notify('auth_failed', reason);
});

// 父页面可以让画面重连，或者转发按键
window.addEventListener('message', (e) => {
  const data = e.data || {};
  if (data.target !== 'ldm-screen') return;
  if (data.action === 'reload') location.reload();
  if (data.action === 'focus') { try { rfb.focus(); } catch (_) {} }
  if (data.action === 'ctrlaltdel') { try { rfb.sendCtrlAltDel(); } catch (_) {} }
});
</script>
</body>
</html>
