# 小红书直播间采集规则
# 小红书的直播 deeplink 版本差异较大，下面给了多个候选，适配器会逐个尝试；
# 全部失败时会回落到「打开主播主页 → 点直播中入口」。
package: com.xingin.xhs
package_alternatives: []

launch:
  wait_seconds: 12
  room_id_deeplinks:
    - 'xhsdiscover://live_audience?room_id={target}'
    - 'xhsdiscover://live/{target}'
    - 'xhsdiscover://livestream/{target}'
    - 'xhsdiscover://live?room_id={target}'
  user_id_deeplinks:
    - 'xhsdiscover://live_audience?host_id={target}'
    - 'xhsdiscover://user/{target}'
  deeplinks:
    - 'xhsdiscover://live_audience?room_id={target}'
  profile_deeplink: 'xhsdiscover://user/{target}'
  profile_live_markers:
    - '直播中'
    - '正在直播'
    - '去看看直播'

popups:
  dismiss_texts:
    - '^我知道了$'
    - '^继续观看$'
    - '^以后再说$'
    - '^暂不'
    - '^取消$'
    - '^关闭$'
    - '^允许$'
    - '^同意$'
    - '^跳过$'

live_info:
  room_markers:
    - '说点什么'
    - '发评论'
    - '来聊聊'
    - '^商品$'
    - '宝贝'
    - '购物车'
  end_markers:
    - '直播已结束'
    - '主播已下播'
    - '直播结束'
    - '看看其他直播'
  viewer_region: [0.3, 0.0, 1.0, 0.14]
  viewer_patterns:
    - '([\d.,]+[万亿wW]?)\s*人?(?:在线|观看|看过)'
    - '在线\s*([\d.,]+[万亿wW]?)'
  viewer_fallback_patterns:
    - '([\d.,]+[万亿wW]?)\s*人(?:次)?(?:看过|观看|来过)'
  like_patterns:
    - '([\d.,]+[万亿wW]?)\s*(?:个?赞|点赞)'
  follower_patterns:
    - '粉丝\s*([\d.,]+[万亿wW]?)'
  anchor:
    region: [0.0, 0.0, 0.6, 0.13]
    near_text: '关注'
  title:
    region: [0.0, 0.02, 1.0, 0.24]
    min_len: 4
  noise_patterns:
    - '^\+?关注$'
    - '^分享$'
    - '^举报$'
    - '^更多$'
    - '^说点什么$'
    - '^发评论$'
    - '^在线$'
    - '^礼物$'
    - '^福利$'

products:
  entry:
    text_patterns:
      - '^商品$'
      - '购物车'
      - '^宝贝$'
      - '^\d+件(?:商品|好物)$'
      - '^去看看$'
      - '^好物$'
    region: [0.5, 0.5, 1.0, 0.98]
    fallback_regions:
      - [0.84, 0.72, 0.99, 0.82]
      - [0.84, 0.62, 0.99, 0.72]
  panel_markers:
    - '^全部商品$'
    - '商品列表'
    - '^宝贝$'
    - '^讲解中$'
    - '^去购买$'
    - '^立即购买$'
    - '已售'
  list_region: [0.0, 0.22, 1.0, 1.0]
  price_patterns:
    - '[¥￥]\s?([\d,]+(?:\.\d+)?)'
    - '([\d,]+(?:\.\d+)?)\s?元'
    - '到手价?\s?[¥￥]?\s?([\d,]+(?:\.\d+)?)'
  sales_patterns:
    - '(已售\s?[\d.,]+[万wW]?\+?)'
    - '(销量\s?[\d.,]+[万wW]?\+?)'
    - '([\d.,]+[万wW]?\+?人(?:已)?(?:买|下单))'
  stock_patterns:
    - '(仅剩\s?\d+\s?件?)'
    - '(库存\s?\d+)'
    - '(已售罄)'
    - '(售罄)'
  coupon_patterns:
    - '(到手[\d.,]+)'
    - '(立减[\d.,]+)'
    - '(\d+元(?:优惠)?券)'
  product_id_patterns:
    - '(?:商品|货号)\s?(?:id|ID|编号)?[:：]?\s?(\d{8,})'
  ignore_patterns:
    - '^去(?:看看|购买|下单)$'
    - '^立即(?:购买|下单)$'
    - '^讲解中$'
    - '^\d+$'
    - '^已售'
    - '^仅剩'
    - '^库存'
    - '^到手'
    - '^立减'
    - '^全部商品$'
    - '^包邮$'
    - '^分享$'
  title_min_len: 4
  max_scrolls: 8
  min_card_width_ratio: 0.35
  max_ancestor_climb: 7
  panel_open_seconds: 3.0
  scroll_settle_seconds: 1.2
  swipe_duration_ms: 500

comments:
  region: [0.0, 0.5, 0.78, 0.92]
  min_len: 2
  ignore_patterns:
    - '^说点什么$'
    - '^发评论$'
    - '来了$'
    - '关注了主播$'
    - '送出'
