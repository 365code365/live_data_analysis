<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播间监控控制台</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>直播间监控控制台</h1>
      <span class="sub" id="version"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="overview" role="tab" aria-selected="true">概览</button>
      <button class="tab" data-view="devices" role="tab" aria-selected="false">设备</button>
      <button class="tab" data-view="proxies" role="tab" aria-selected="false">代理</button>
      <button class="tab" data-view="tasks" role="tab" aria-selected="false">任务</button>
      <button class="tab" data-view="data" role="tab" aria-selected="false">数据</button>
      <button class="tab" data-view="recordings" role="tab" aria-selected="false">录像</button>
      <button class="tab" data-view="events" role="tab" aria-selected="false">事件</button>
    </nav>
    <div class="actions">
      <label class="switch"><input type="checkbox" id="autoRefresh" checked /> 自动刷新</label>
      <button class="btn ghost" id="refreshBtn">刷新</button>
    </div>
  </header>

  <main>
    <!-- 概览 -->
    <section class="view active" id="view-overview">
      <div class="stat-grid" id="statGrid"></div>
      <div class="card">
        <h2>运行环境</h2>
        <div id="sysInfo" class="kv"></div>
      </div>
      <div class="card">
        <h2>最近事件</h2>
        <div id="overviewEvents" class="log"></div>
      </div>
    </section>

    <!-- 设备 -->
    <section class="view" id="view-devices">
      <div class="card">
        <h2>新建设备</h2>
        <form id="deviceForm" class="form-row">
          <label>名称<input name="name" required placeholder="douyin-01" /></label>
          <label>宽<input name="width" type="number" placeholder="720" /></label>
          <label>高<input name="height" type="number" placeholder="1280" /></label>
          <label>DPI<input name="dpi" type="number" placeholder="320" /></label>
          <label>代理<select name="proxy_id" id="deviceProxySelect"><option value="">直连</option></select></label>
          <label class="switch"><input type="checkbox" name="autostart" checked /> 创建后启动</label>
          <button class="btn primary" type="submit">创建</button>
        </form>
        <p class="hint">安卓首次启动要 1-3 分钟。启动后用 VNC 手动装 APK、登录账号。</p>
      </div>
      <div id="deviceList" class="device-grid"></div>
    </section>

    <!-- 代理 -->
    <section class="view" id="view-proxies">
      <div class="card">
        <h2>新增代理</h2>
        <form id="proxyForm" class="form-row">
          <label>名称<input name="name" required placeholder="hk-01" /></label>
          <label>类型<select name="scheme">
            <option value="socks5">socks5</option>
            <option value="socks5h">socks5h</option>
            <option value="http">http</option>
            <option value="https">https</option>
          </select></label>
          <label>主机<input name="host" required placeholder="1.2.3.4" /></label>
          <label>端口<input name="port" type="number" required placeholder="1080" /></label>
          <label>用户名<input name="username" placeholder="可空" /></label>
          <label>密码<input name="password" type="password" placeholder="可空" /></label>
          <label>备注<input name="remark" placeholder="可空" /></label>
          <button class="btn primary" type="submit">保存</button>
        </form>
        <p class="hint">代理会以 tun 全局透明方式接管安卓容器的全部流量（含 UDP 与 DNS），不需要在 App 里配。</p>
      </div>
      <div class="card">
        <table class="table" id="proxyTable">
          <thead><tr><th>ID</th><th>名称</th><th>地址</th><th>状态</th><th>出口 IP</th><th>归属</th><th>检测时间</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 任务 -->
    <section class="view" id="view-tasks">
      <div class="card">
        <h2>新建监控任务</h2>
        <form id="taskForm" class="form-row">
          <label>名称<input name="name" required placeholder="某主播晚场" /></label>
          <label>平台<select name="platform">
            <option value="douyin">抖音</option>
            <option value="xiaohongshu">小红书</option>
          </select></label>
          <label class="grow">直播间标识<input name="target" required placeholder="抖音: room_id / live.douyin.com/123456；小红书: 直播链接或 24 位用户 id" /></label>
          <label>设备<select name="device_id" id="taskDeviceSelect"></select></label>
          <label>间隔(秒)<input name="interval_seconds" type="number" value="60" min="10" /></label>
          <label class="switch"><input type="checkbox" name="collect_products" checked /> 采商品</label>
          <label class="switch"><input type="checkbox" name="collect_comments" /> 采弹幕</label>
          <label class="switch"><input type="checkbox" name="record_video" /> 录屏</label>
          <label class="switch"><input type="checkbox" name="enabled" checked /> 启用</label>
          <button class="btn primary" type="submit">创建</button>
        </form>
      </div>
      <div class="card">
        <table class="table" id="taskTable">
          <thead><tr><th>ID</th><th>名称</th><th>平台</th><th>目标</th><th>设备</th><th>间隔</th><th>状态</th><th>次数</th><th>下次</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 数据 -->
    <section class="view" id="view-data">
      <div class="card">
        <div class="form-row">
          <label>任务<select id="dataTaskSelect"></select></label>
          <button class="btn ghost" id="dataReload">加载</button>
        </div>
      </div>
      <div class="card">
        <h2>直播间快照</h2>
        <table class="table" id="snapshotTable">
          <thead><tr><th>时间</th><th>状态</th><th>标题</th><th>主播</th><th>在线</th><th>点赞</th><th>商品数</th><th>截图</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="grid-2">
        <div class="card">
          <h2>最近一次商品列表</h2>
          <table class="table" id="productTable">
            <thead><tr><th>#</th><th>商品</th><th>价格</th><th>原价</th><th>销量</th><th>库存</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="card">
          <h2>商品价格走势</h2>
          <select id="productKeySelect"></select>
          <div id="seriesChart" class="chart"></div>
          <table class="table small" id="seriesTable">
            <thead><tr><th>时间</th><th>价格</th><th>位次</th><th>销量</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 录像 -->
    <section class="view" id="view-recordings">
      <div class="card">
        <table class="table" id="recordingTable">
          <thead><tr><th>ID</th><th>任务</th><th>设备</th><th>状态</th><th>开始</th><th>时长</th><th>大小</th><th>分段</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- 事件 -->
    <section class="view" id="view-events">
      <div class="card">
        <h2>事件日志</h2>
        <div id="eventLog" class="log"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">标题</h3>
        <button class="btn ghost" id="modalClose">关闭</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
