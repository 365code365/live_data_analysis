services:
  controller:
    build:
      context: .
      dockerfile: docker/controller/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL-https://mirrors.aliyun.com/pypi/simple/}
        # 置空以覆盖 Docker Desktop 从系统继承的代理（代理软件关闭时会拖垮构建）
        http_proxy: ${BUILD_HTTP_PROXY-}
        https_proxy: ${BUILD_HTTPS_PROXY-}
        HTTP_PROXY: ${BUILD_HTTP_PROXY-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY-}
        no_proxy: ${BUILD_NO_PROXY_HOSTS-*}
    image: ldm/controller:latest
    container_name: ldm_controller
    restart: unless-stopped
    ports:
      - "${CONTROLLER_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      GATEWAY_IMAGE: ${GATEWAY_IMAGE:-ldm/proxy-gateway:latest}
      VNC_IMAGE: ${VNC_IMAGE:-ldm/android-vnc:latest}
      REDROID_IMAGE: ${REDROID_IMAGE:-redroid/redroid:13.0.0_64only-latest}
      DEVICE_WIDTH: ${DEVICE_WIDTH:-720}
      DEVICE_HEIGHT: ${DEVICE_HEIGHT:-1280}
      DEVICE_DPI: ${DEVICE_DPI:-320}
      REDROID_GPU_MODE: ${REDROID_GPU_MODE:-guest}
      DEVICE_PORT_BASE: ${DEVICE_PORT_BASE:-21000}
      DEVICE_PORT_MAX: ${DEVICE_PORT_MAX:-21999}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-ldm_net}
      DEFAULT_INTERVAL_SECONDS: ${DEFAULT_INTERVAL_SECONDS:-60}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-8}
      SELECTORS_DIR: ${SELECTORS_DIR:-}
      RECORD_SEGMENT_SECONDS: ${RECORD_SEGMENT_SECONDS:-170}
      RECORD_BITRATE: ${RECORD_BITRATE:-4000000}
      RECORD_KEEP_SEGMENTS: ${RECORD_KEEP_SEGMENTS:-false}
      GATEWAY_DNS_UPSTREAM: ${GATEWAY_DNS_UPSTREAM:-https://1.1.1.1/dns-query,tls://1.1.1.1}
      GATEWAY_DNS_FALLBACK: ${GATEWAY_DNS_FALLBACK:-tcp://1.1.1.1:53,tcp://8.8.8.8:53}
      # 控制器容器内访问设备 adb 的宿主地址
      DOCKER_HOST_ADDR: ${DOCKER_HOST_ADDR:-host.docker.internal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 在 lima/虚拟机里跑时把 DATA_HOST_DIR 指到虚拟机本地盘：
      # SQLite 在 virtiofs 共享目录上的锁语义不可靠
      - ${DATA_HOST_DIR:-./data}:/app/data
      - ./apks:/app/apks:ro
      # 控制台前端与选择器规则挂进去：改完刷新页面 / 调 reload 接口即生效，不用重建镜像
      - ./controller/app/web:/app/app/web:ro
      - ./controller/app/platforms/selectors:/app/app/platforms/selectors:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ldm_net

networks:
  ldm_net:
    name: ${DOCKER_NETWORK:-ldm_net}
    driver: bridge
